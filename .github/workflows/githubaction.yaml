name: Build and Deploy on dev

on:
  push:
    branches: [ "develop" ]
env:
  ENVIRONMENT: dev
  IMAGE: akondocker97/sample-node-app
  VERSION: dev-1.0.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ env.IMAGE }}:${{ env.VERSION }}


    - name: Configure AWS CLI
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set default.region ${{ secrets.AWS_DEFAULT_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --kubeconfig eksconfig.yaml

    - name: Deploy to EKS
      uses: koslibpro/helm-eks-action@master
      with:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    - run: |
        export KUBECONFIG=eksconfig.yaml
        helm upgrade \
          --install ${{ env.ENVIRONMENT }}-sample-node-app \
          ./helm/sample-node-app \
          --set image.repository=${{ env.IMAGE }} \
          --set image.imagetag=${{ env.VERSION }} \
          -n ${{ env.ENVIRONMENT }}
